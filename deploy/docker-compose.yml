name: lunatv

services:
  lunatv:
    image: ghcr.io/kitzhn/lunatv:latest
    restart: unless-stopped
    ports:
      # Local-only by default. Use an authenticated HTTPS reverse proxy for remote access.
      - "127.0.0.1:3000:3000"
    environment:
      USERNAME: ${LUNATV_USERNAME:?Set LUNATV_USERNAME in .env}
      PASSWORD: ${LUNATV_PASSWORD:?Set LUNATV_PASSWORD in .env}
      NEXT_PUBLIC_STORAGE_TYPE: redis
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-LunaTV}
      SITE_BASE: ${SITE_BASE:-}
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
